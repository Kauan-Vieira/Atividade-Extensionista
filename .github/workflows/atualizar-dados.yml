name: Atualizar dados de vegetação

# Confere todo mês se o MapBiomas publicou um ano novo. Se sim, calcula a
# vegetação dos bairros, roda as conferências e os testes e abre um PR
# para revisão. Nada vai para o ar sem alguém fazer o merge.
on:
  schedule:
    - cron: "17 12 3 * *"  # dia 3 de cada mês, 9h17 em Curitiba
  workflow_dispatch:        # permite rodar na mão pela aba Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-coleta.txt -r requirements-dev.txt

      - name: Coletar anos novos do MapBiomas
        run: python scripts/coletar_cobertura.py --resumo resumo.md

      - name: Rodar os testes com os dados novos
        run: pytest -v

      - name: Abrir PR com os dados novos
        if: hashFiles('resumo.md') != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: dados/atualizacao-mapbiomas
          add-paths: src/Dados-Bairros/
          commit-message: Atualiza a vegetação dos bairros com dados novos do MapBiomas
          title: Atualiza a vegetação dos bairros com dados novos do MapBiomas
          body-path: resumo.md
